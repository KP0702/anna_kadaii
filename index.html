<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anna Kadaii — Coming Soon</title>
  <meta name="description" content="Anna Kadaii — Authentic South Indian Food. Arambol, North Goa. Online ordering coming soon." />
  <meta name="theme-color" content="#f5f2eb" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --linen: #f5f2eb;
      --paper: #fbf9f4;
      --ink: #25221e;
      --ink-soft: #4a4038;
      --muted: #857b70;
      --rust: #a5563a;
      --rust-deep: #8b4530;
      --hairline: #ddd6c8;
      --serif: 'Lora', Georgia, 'Times New Roman', serif;
      --sans: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 2px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 40%, var(--paper) 0%, var(--linen) 60%, #ece6d9 100%);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    a { color: inherit; }

    /* ---------- Animated background ---------- */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .ico {
      position: absolute;
      width: clamp(56px, 9vw, 120px);
      height: auto;
      fill: none;
      stroke: var(--rust);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.2;
      animation: float 14s ease-in-out infinite;
    }
    .i1 { top: 9%;  left: 6%;  --r: -8deg;  animation-delay: -2s; }
    .i2 { top: 14%; right: 8%; --r: 10deg;  animation-delay: -6s; width: clamp(50px, 8vw, 104px); }
    .i3 { top: 46%; left: 3%;  --r: 6deg;   animation-delay: -9s; width: clamp(48px, 7vw, 92px); }
    .i4 { top: 50%; right: 4%; --r: -6deg;  animation-delay: -4s; }
    .i5 { bottom: 12%; left: 9%; --r: 12deg; animation-delay: -11s; width: clamp(44px, 7vw, 84px); }
    .i6 { bottom: 26%; right: 14%; --r: -12deg; animation-delay: -7s; width: clamp(42px, 6vw, 76px); }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--r)); }
      50%      { transform: translateY(-18px) rotate(calc(var(--r) * -1)); }
    }
    .steam { position: absolute; bottom: -10%; width: 60px; height: 200px; fill: none; stroke: var(--rust); stroke-width: 2; stroke-linecap: round; opacity: 0; animation: rise-steam 9s ease-in infinite; }
    .s1 { left: 22%; animation-delay: 0s; }
    .s2 { left: 48%; animation-delay: -3s; height: 240px; }
    .s3 { left: 74%; animation-delay: -6s; }
    @keyframes rise-steam {
      0%   { transform: translateY(0) scaleX(1);    opacity: 0; }
      20%  { opacity: 0.22; }
      100% { transform: translateY(-85vh) scaleX(1.6); opacity: 0; }
    }

    /* ---------- Page (never scrolls) ---------- */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 16px 92px;
    }
    .hero { display: flex; flex-direction: column; align-items: center; }
    .hero > * { animation: rise 0.8s var(--ease) both; }
    .hero > :nth-child(2) { animation-delay: 0.08s; }
    .hero > :nth-child(3) { animation-delay: 0.16s; }
    .hero > :nth-child(4) { animation-delay: 0.24s; }
    .hero > :nth-child(5) { animation-delay: 0.32s; }
    .hero > :nth-child(6) { animation-delay: 0.4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--rust);
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: clamp(1.9rem, min(9vw, 8vh), 4rem);
      margin: clamp(0.5rem, 1.6vh, 1.1rem) 0 0;
      padding-left: 0.22em;
    }
    .tagline {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-soft);
      font-size: clamp(1rem, min(4vw, 3vh), 1.35rem);
      margin-top: clamp(0.4rem, 1.4vh, 0.9rem);
    }
    .location {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: clamp(0.5rem, 1.6vh, 1.1rem);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .location svg { width: 14px; height: 14px; color: var(--rust); flex: none; }

    .rule { width: 56px; border: 0; border-top: 1px solid var(--hairline); margin: clamp(0.9rem, 3vh, 2.2rem) auto; }

    .qr-wrap { display: flex; flex-direction: column; align-items: center; }
    .qr-card {
      display: block;
      width: clamp(120px, min(46vw, 25vh), 200px);
      padding: 12px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .qr-card:hover, .qr-card:focus-visible { border-color: var(--rust); transform: translateY(-2px); outline: none; }
    .qr-card svg { display: block; width: 100%; height: auto; }
    .stay {
      font-family: var(--serif);
      font-size: clamp(1rem, min(4vw, 3vh), 1.35rem);
      margin-top: clamp(0.7rem, 2vh, 1.3rem);
    }
    .handle {
      display: inline-block;
      margin-top: 0.2rem;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--rust);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s var(--ease), color 0.2s var(--ease);
    }
    .handle:hover, .handle:focus-visible { color: var(--rust-deep); border-bottom-color: currentColor; outline: none; }

    /* ---------- Powered-by card (bottom right) ---------- */
    .powered {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 10px 10px;
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(37, 34, 30, 0.08);
      text-decoration: none;
      text-align: left;
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .powered:hover, .powered:focus-visible { border-color: var(--rust); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37, 34, 30, 0.12); outline: none; }
    .powered img { display: block; width: 58px; height: auto; flex: none; }
    .powered-text { display: flex; flex-direction: column; line-height: 1.25; }
    .powered-text .eyebrow { font-size: 0.625rem; color: var(--muted); }
    .powered-text strong { font-family: var(--serif); font-weight: 500; font-size: 1.05rem; color: var(--ink); margin-top: 1px; }
    .powered-text span.url { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; color: var(--rust); margin-top: 2px; }

    /* Short landscape screens: two columns so nothing scrolls */
    @media (max-height: 520px) and (min-width: 560px) {
      .page { padding: 12px 16px 76px; }
      .hero { flex-direction: row; align-items: center; gap: 48px; text-align: left; }
      .hero > .rule { display: none; }
      .hero-text { display: flex; flex-direction: column; align-items: flex-start; }
      h1 { padding-left: 0; font-size: 2.1rem; }
    }
    @media (max-width: 420px) {
      .powered { gap: 10px; padding: 8px 12px 8px 8px; }
      .powered img { width: 46px; }
      .powered-text strong { font-size: 0.95rem; }
      .page { padding-bottom: 84px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .steam { display: none; }
    }
  </style>
</head>
